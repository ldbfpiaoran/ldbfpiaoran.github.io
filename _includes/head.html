<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="keyword"  content="{{ site.keyword }}">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">

    <!-- 主题初始化:必须在 CSS 加载前执行,避免暗色模式闪白 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || t === 'light') {
                    document.documentElement.classList.add(t);
                }
            } catch (e) { /* ignore */ }
        })();
    </script>

    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Bootstrap Core CSS -->
    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/hux-blog.min.css" | prepend: site.baseurl }}">

    <!-- Pygments Github CSS -->
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">

    <!-- Modern polish layer (2026) -->
    <link rel="stylesheet" href="{{ "/css/modern.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
